<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSU FoodQ - MVP 1</title><style>
:root{--g:#174f3b;--l:#dff08b;--bg:#f5f5ef;--line:#dde2da;--muted:#66736b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17251e;font-family:Tahoma,"Noto Sans Thai",sans-serif}button,input{font:inherit}.hide{display:none!important}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:10}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:14px 14px 14px 4px;background:var(--g);color:var(--l);display:grid;place-items:center;font-size:23px;font-weight:900}.brand div{display:flex;flex-direction:column}.brand small,.muted{color:var(--muted)}.actions{display:flex;gap:7px}.actions button,.ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#dff08b99,transparent 30%),var(--bg)}.loginbox{width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:38px;box-shadow:0 25px 75px #173b2920}.loginbox h1{font-size:36px;margin:18px 0}.loginbox label{display:grid;gap:7px;font-weight:700}.loginbox input{border:1px solid var(--line);padding:13px;border-radius:12px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.roles button{border:1px solid var(--line);background:#f6f8f3;border-radius:17px;padding:18px;text-align:left;cursor:pointer}.roles button:hover{border-color:#7a9d89;transform:translateY(-2px)}.roles b{font-size:25px;display:block}.roles strong,.roles small{display:block;margin-top:5px}.roles small{color:var(--muted)}.wrap{max-width:1180px;margin:auto;padding:30px 20px 70px}.hero{background:var(--g);color:#fff;border-radius:23px;padding:27px 30px;display:flex;justify-content:space-between;align-items:center}.hero p{color:#b9d0c3;margin:0}.hero h1{margin:5px 0}.pill{background:#ffffff13;border:1px solid #ffffff25;padding:13px 20px;border-radius:16px;text-align:center}.pill b{font-size:28px;color:var(--l);display:block}.orders{margin-top:22px}.orders article{display:grid;grid-template-columns:65px 1fr auto auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin:7px 0}.orders article>b{font-size:20px;color:var(--g)}.orders article div{display:flex;flex-direction:column}.orders article span{background:#e4f2e7;color:#286748;padding:6px 9px;border-radius:99px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.shop{border:1px solid var(--line);background:#fff;border-radius:17px;padding:16px;text-align:left;cursor:pointer}.shop:hover{transform:translateY(-2px);border-color:#9aad9f}.shop .emoji{font-size:27px}.shop h3{margin:10px 0 3px}.shop p{margin:0;color:var(--muted);font-size:12px}.shop footer{display:flex;justify-content:space-between;border-top:1px solid #edf0eb;margin-top:13px;padding-top:10px;color:var(--g)}.menu{position:fixed;right:20px;top:90px;width:min(420px,calc(100vw - 40px));background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;z-index:20;box-shadow:0 25px 75px #152c1e35}.menuhead{display:flex;justify-content:space-between}.menuhead h2{margin:0}.dish{display:grid;grid-template-columns:1fr auto;align-items:center;padding:14px 0;border-bottom:1px solid #edf0eb}.dish div{display:flex;flex-direction:column}.dish small{color:var(--muted)}.qty{display:flex!important;flex-direction:row!important;align-items:center;gap:8px}.qty button{border:0;background:#edf0ea;width:28px;height:28px;border-radius:8px}.confirm{width:100%;border:0;background:var(--l);color:var(--g);font-weight:900;border-radius:12px;padding:13px;margin-top:14px;cursor:pointer}.merchant{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 76px)}.side{background:#fff;border-right:1px solid var(--line);padding:18px;height:calc(100vh - 76px);overflow:auto}.side button{width:100%;border:0;background:transparent;padding:9px;border-radius:10px;display:flex;gap:9px;text-align:left;cursor:pointer}.side button.on{background:#e8f0e7}.side button div{display:flex;flex-direction:column}.side button small{color:var(--muted)}.main{padding:28px}.ordercard{display:grid;grid-template-columns:80px 1fr 200px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin:10px 0}.q{border-right:1px solid var(--line)}.q b{font-size:27px;color:var(--g);display:block}.info{padding:0 17px}.info h3,.info p{margin:3px 0}.state{text-align:right}.state span{font-size:11px;color:#286748;background:#e4f2e7;padding:6px 9px;border-radius:99px}.state button{display:block;margin:18px 0 0 auto;border:0;background:var(--g);color:#fff;border-radius:9px;padding:9px;cursor:pointer}.empty{text-align:center;background:#fff;border:1px dashed #abb9ae;border-radius:17px;padding:50px}.toast{position:fixed;top:88px;left:50%;transform:translateX(-50%);background:#122c20;color:#fff;border-radius:11px;padding:11px 16px;z-index:50}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.merchant{grid-template-columns:1fr}.side{height:230px;border:0}.ordercard{grid-template-columns:60px 1fr}.state{grid-column:1/-1;text-align:left;margin-top:12px}.state button{margin-left:0}.orders article{grid-template-columns:55px 1fr}.orders article span,.orders article em{margin-top:6px}}@media(max-width:520px){.loginbox{padding:25px}.roles,.grid{grid-template-columns:1fr}.top{height:auto;padding:10px}.brand small{display:none}.actions{flex-direction:column}.actions button{font-size:10px;padding:5px}.hero{padding:20px}.hero h1{font-size:25px}.main{padding:18px}.menu{right:10px;top:82px;width:calc(100vw - 20px)}}
</style></head><body><div id="toast" class="toast hide"></div><section id="login" class="login"><div class="loginbox"><span class="logo">Q</span><h1>เข้าสู่ระบบจำลอง</h1><label>ชื่อผู้ใช้งาน<input id="username" value="สรวิชญ์"></label><div class="roles"><button onclick="login('customer')"><b>👤</b><strong>เข้าสู่ระบบผู้ใช้</strong><small>เลือกร้าน สั่งอาหาร และติดตามคิว</small></button><button onclick="login('store')"><b>🏪</b><strong>เข้าสู่ระบบร้านค้า</strong><small>ดูรายการสั่งซื้อและจัดการคิว</small></button></div><p class="muted">ระบบจำลอง ข้อมูลเก็บเฉพาะใน Browser เครื่องนี้</p></div></section><section id="app" class="hide"><header class="top"><div class="brand"><span class="logo">Q</span><div><strong>MSU FoodQ</strong><small id="who"></small></div></div><div class="actions"><button onclick="switchRole()" id="switch"></button><button onclick="logout()">ออกจากระบบ</button></div></header><div id="customer"></div><div id="merchant"></div></section><div id="menu" class="menu hide"></div><script>
const raw=[['ครัวป้าสมใจ','อาหารตามสั่ง','🍳'],['ก๋วยเตี๋ยวเรือ มมส','ก๋วยเตี๋ยว','🍜'],['ข้าวมันไก่หน้ามอ','จานด่วน','🍗'],['ส้มตำแซ่บนัว','อาหารอีสาน','🥗'],['ข้าวแกงคุณยาย','ข้าวแกง','🍛'],['หมูทอดเจ๊นิด','จานด่วน','🍖'],['ราดหน้าอาม่า','อาหารตามสั่ง','🥘'],['ชาบูเสียบไม้','ของว่าง','🍢'],['ร้านเจเพื่อสุขภาพ','สุขภาพ','🥬'],['ขนมจีนบ้านสวน','อาหารไทย','🍝'],['โจ๊กหม้อดิน','จานด่วน','🥣'],['ไก่ย่างเขาสวนกวาง','อาหารอีสาน','🍗'],['ครัวฮาลาล','ฮาลาล','🍚'],['ชาและกาแฟหน้าคณะ','เครื่องดื่ม','🥤'],['ผลไม้สดปั่น','เครื่องดื่ม','🍉']];
const shops=raw.map((x,i)=>({id:i+1,name:x[0],type:x[1],icon:x[2],wait:(i*3+2)%10,now:20+i*3,menu:[{name:(i==1?'ก๋วยเตี๋ยวเรือหมู':i==13?'ชาไทย':'เมนูแนะนำ'),price:45+(i%3)*5},{name:(i==1?'ก๋วยเตี๋ยวเรือเนื้อ':i==13?'โกโก้':'เมนูธรรมดา'),price:40+(i%3)*5},{name:(i==1?'เกาเหลา':i==13?'กาแฟเย็น':'เมนูพิเศษ'),price:55+(i%3)*5}]}));
let role=null,name='สรวิชญ์',storeId=1,active=null,cart={};let orders=JSON.parse(localStorage.getItem('foodq_orders')||'[]');
function save(){localStorage.setItem('foodq_orders',JSON.stringify(orders))}function toast(t){let e=document.getElementById('toast');e.textContent='✓ '+t;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),2200)}
function login(r){name=document.getElementById('username').value.trim()||'ผู้ใช้';role=r;document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');render()}
function logout(){role=null;document.getElementById('app').classList.add('hide');document.getElementById('login').classList.remove('hide');closeMenu()}function switchRole(){role=role==='customer'?'store':'customer';render()}
function render(){document.getElementById('who').textContent=role==='customer'?'ผู้ใช้: '+name:'ระบบจัดการร้านค้า';document.getElementById('switch').textContent='สลับเป็น'+(role==='customer'?'ร้านค้า':'ผู้ใช้');document.getElementById('customer').classList.toggle('hide',role!=='customer');document.getElementById('merchant').classList.toggle('hide',role!=='store');role==='customer'?renderCustomer():renderMerchant()}
function renderCustomer(){let mine=orders.filter(o=>o.customer===name);document.getElementById('customer').innerHTML=`<div class="wrap"><section class="hero"><div><p>โรงอาหารมหาวิทยาลัยมหาสารคาม</p><h1>สวัสดี ${name} 👋</h1><span>เลือกเมนูและรับคิวได้จาก 15 ร้าน</span></div><div class="pill"><b>${mine.length}</b><small>ออเดอร์ของฉัน</small></div></section>${mine.length?`<section class="orders"><h2>รายการของฉัน</h2>${mine.map(o=>`<article><b>A${o.queue}</b><div><strong>${shops[o.shopId-1].name}</strong><small>${o.items.map(x=>x.name+' × '+x.qty).join(', ')}</small></div><span>${o.status}</span><em>฿${o.total}</em></article>`).join('')}</section>`:''}<h2>เลือกร้านอาหาร <small class="muted">15 ร้าน</small></h2><section class="grid">${shops.map(s=>`<button class="shop" onclick="openMenu(${s.id})"><span class="emoji">${s.icon}</span><h3>${s.name}</h3><p>${s.type}</p><footer><b>รอ ${s.wait} คิว</b><small>ประมาณ ${Math.max(2,s.wait*2)} นาที</small></footer></button>`).join('')}</section></div>`}
function openMenu(id){active=shops[id-1];cart={};drawMenu()}function closeMenu(){document.getElementById('menu').classList.add('hide')}function qty(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);drawMenu()}
function drawMenu(){let total=active.menu.reduce((s,m,i)=>s+m.price*(cart[i]||0),0),e=document.getElementById('menu');e.classList.remove('hide');e.innerHTML=`<div class="menuhead"><div><small class="muted">กำลังสั่งจาก</small><h2>${active.icon} ${active.name}</h2></div><button class="ghost" onclick="closeMenu()">✕</button></div>${active.menu.map((m,i)=>`<article class="dish"><div><strong>${m.name}</strong><small>฿${m.price}</small></div><div class="qty"><button onclick="qty(${i},-1)">−</button><b>${cart[i]||0}</b><button onclick="qty(${i},1)">+</button></div></article>`).join('')}<button class="confirm" onclick="submitOrder()">ยืนยันการสั่งอาหาร · ฿${total}</button>`}
function submitOrder(){let items=active.menu.map((m,i)=>({name:m.name,price:m.price,qty:cart[i]||0})).filter(x=>x.qty);if(!items.length)return toast('กรุณาเลือกเมนูก่อน');let total=items.reduce((s,x)=>s+x.price*x.qty,0),queue=active.now+orders.filter(o=>o.shopId===active.id).length+1;orders.push({id:Date.now(),customer:name,shopId:active.id,items,queue,status:'รอร้านรับออเดอร์',total});save();closeMenu();renderCustomer();toast('สั่งสำเร็จ ได้คิว A'+queue)}
function renderMerchant(){let s=shops[storeId-1],list=orders.filter(o=>o.shopId===storeId);document.getElementById('merchant').innerHTML=`<div class="merchant"><aside class="side"><h3>เลือกร้านของคุณ</h3>${shops.map(x=>`<button class="${storeId===x.id?'on':''}" onclick="storeId=${x.id};renderMerchant()"><span>${x.icon}</span><div><b>${x.name}</b><small>${orders.filter(o=>o.shopId===x.id).length} ออเดอร์</small></div></button>`).join('')}</aside><main class="main"><p class="muted">หน้าจัดการออเดอร์</p><h1>${s.icon} ${s.name}</h1>${list.length?list.map(o=>`<article class="ordercard"><div class="q"><small>คิว</small><b>A${o.queue}</b></div><div class="info"><h3>${o.customer}</h3>${o.items.map(x=>`<p>${x.qty} × ${x.name}</p>`).join('')}<strong>รวม ฿${o.total}</strong></div><div class="state"><span>${o.status}</span>${nextButton(o)}</div></article>`).join(''):`<div class="empty"><h2>📭 ยังไม่มีรายการสั่งซื้อ</h2><p>ทดลองสลับเป็นผู้ใช้แล้วสั่งอาหารจากร้านนี้</p></div>`}</main></div>`}
function nextButton(o){let map={'รอร้านรับออเดอร์':['รับออเดอร์แล้ว','รับออเดอร์'],'รับออเดอร์แล้ว':['กำลังทำ','เริ่มทำอาหาร'],'กำลังทำ':['พร้อมรับอาหาร','ทำเสร็จแล้ว'],'พร้อมรับอาหาร':['รับอาหารแล้ว','ปิดออเดอร์']},n=map[o.status];return n?`<button onclick="setStatus(${o.id},'${n[0]}')">${n[1]}</button>`:''}function setStatus(id,s){orders=orders.map(o=>o.id===id?{...o,status:s}:o);save();renderMerchant();toast('เปลี่ยนสถานะเป็น '+s)}
</script></body></html>
