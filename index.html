function render(){document.getElementById('who').textContent=role==='customer'?'ผู้ใช้: '+name:'ระบบจัดการร้านค้า';document.getElementById('switch').textContent='สลับเป็น'+(role==='customer'?'ร้านค้า':'ผู้ใช้');document.getElementById('customer').classList.toggle('hide',role!=='customer');document.getElementById('merchant').classList.toggle('hide',role!=='store');role==='customer'?renderCustomer():renderMerchant()}
function isActiveOrder(o){return o.status!=='รับอาหารแล้ว'}function activeQueueCount(shopId){return orders.filter(o=>o.shopId===shopId&&isActiveOrder(o)).length}function queueWaitText(n){return n?`ประมาณ ${n*2} นาที`:'รับคิวได้เลย'}
function customerOrderCard(o){return `<article><b>A${o.queue}</b><div><strong>${shops[o.shopId-1].name}</strong><small>${o.items.map(x=>x.name+' × '+x.qty).join(', ')}</small><small>${o.taste} · ${o.channel} · ${o.paymentMethod}</small></div><span>${o.status}<br>${o.paymentStatus}</span><em>฿${o.total}</em></article>`}
function renderCustomer(){let mine=orders.filter(o=>o.customer===name),current=mine.filter(isActiveOrder),history=mine.filter(o=>!isActiveOrder(o));document.getElementById('customer').innerHTML=`<div class="wrap"><section class="hero"><div><p>โรงอาหารมหาวิทยาลัยมหาสารคาม</p><h1>สวัสดี ${name} 👋</h1><span>เลือกเมนูและรับคิวได้จาก ${shops.length} ร้าน</span><br><button class="scanqr" onclick="scanQr()">▣ จำลองสแกน QR หน้าร้าน</button></div><div class="pill"><b>${current.length}</b><small>กำลังดำเนินการ</small></div></section><section class="orders"><h2>ออเดอร์ที่กำลังดำเนินการ</h2>${current.length?current.map(customerOrderCard).join(''):'<div class="section-empty">ยังไม่มีออเดอร์ที่กำลังดำเนินการ</div>'}</section>${history.length?`<details class="history-panel"><summary>ประวัติการสั่ง (${history.length})</summary><section class="orders">${history.map(customerOrderCard).join('')}</section></details>`:''}<h2>เลือกร้านอาหาร <small class="muted">${shops.length} ร้าน</small></h2><section class="grid">${shops.map(s=>{let q=activeQueueCount(s.id);return`<button class="shop" onclick="openMenu(${s.id},'ออนไลน์')"><span class="emoji">${s.icon}</span><h3>${s.name}</h3><p>${s.type}</p><footer><b class="queue-live">รอ ${q} คิว</b><small>${queueWaitText(q)}</small></footer></button>`}).join('')}</section></div>`}
function showDialog(html){closeDialog();let modal=document.createElement('div');modal.id='appDialog';modal.className='modal-backdrop';modal.innerHTML=`<div class="dialog-card">${html}</div>`;modal.addEventListener('click',e=>{if(e.target===modal)closeDialog()});document.body.appendChild(modal)}function closeDialog(){document.getElementById('appDialog')?.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
function scanQr(){showDialog(`<div class="dialog-title"><div><h2>▣ สแกน QR หน้าร้าน</h2><p>จำลองการสแกนเพื่อเปิดเมนูของร้านโดยตรง</p></div><button class="closex" onclick="closeDialog()" aria-label="ปิด">✕</button></div><div class="scan-box"><div class="scan-icon"></div><b>วาง QR ให้อยู่ในกรอบ</b><p class="muted">สำหรับ Prototype ให้เลือกร้านที่ต้องการจำลอง</p></div><div class="steps"><div><b>1</b>เลือกร้าน</div><div><b>2</b>กดสแกน</div><div><b>3</b>เลือกเมนู</div></div><div class="fieldbox"><label for="qrStore">ร้านที่ต้องการสแกน</label><select id="qrStore">${shops.map(s=>{let q=activeQueueCount(s.id);return`<option value="${s.id}">${s.icon} ${s.name} · รอ ${q} คิว</option>`}).join('')}</select></div><div class="modal-actions"><button class="cancelbtn" onclick="closeDialog()">ยกเลิก</button><button class="okbtn" onclick="finishQrScan()">สแกนและเปิดเมนู</button></div>`)}
function finishQrScan(){let id=Number(document.getElementById('qrStore').value),shop=shops[id-1];closeDialog();openMenu(id,'สแกน QR');toast('สแกนสำเร็จ · เปิดเมนู '+shop.name)}
function openMenu(id,channel='ออนไลน์'){active=shops[id-1];orderChannel=channel;cart={};drawMenu()}function closeMenu(){document.getElementById('menu').classList.add('hide')}function qty(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);drawMenu()}
function tasteSelect(shop,id,mode='order'){let sweet=['เครื่องดื่ม','ของหวาน'].includes(shop.type),label=sweet?'ระดับความหวาน':'ระดับความเผ็ด',values=sweet?['ไม่หวาน','หวานน้อย','หวานปกติ','หวานมาก']:['ไม่เผ็ด','เผ็ดน้อย','เผ็ดปกติ','เผ็ดมาก'],select=`<select id="${id}">${values.map(v=>`<option value="${v}" ${v.endsWith('ปกติ')?'selected':''}>${v}</option>`).join('')}</select>`;return mode==='walk'?`<div class="fieldbox full"><label for="${id}">${label}</label>${select}</div>`:`<label>${label}${select}</label>`}
function drawMenu(){let total=active.menu.reduce((s,m,i)=>s+m.price*(cart[i]||0),0),e=document.getElementById('menu');e.classList.remove('hide');e.innerHTML=`<div class="menuhead"><div><small class="muted">กำลังสั่งจาก · ${orderChannel}</small><h2>${active.icon} ${active.name}</h2></div><button class="ghost" onclick="closeMenu()">✕</button></div>${active.menu.map((m,i)=>`<article class="dish"><div><strong>${m.name}</strong><small>฿${m.price}</small></div><div class="qty"><button onclick="qty(${i},-1)">−</button><b>${cart[i]||0}</b><button onclick="qty(${i},1)">+</button></div></article>`).join('')}<div class="order-form">${tasteSelect(active,'orderTaste')}<label>หมายเหตุอาหาร<textarea id="orderNote" placeholder="เช่น ไม่ใส่ผัก แยกน้ำ"></textarea></label><label>วิธีชำระเงิน<select id="paymentMethod" onchange="updatePaymentButton(${total})"><option value="promptpay">พร้อมเพย์ / QR — สแกนก่อนยืนยัน</option><option value="wallet">บัตร / วอลเล็ต — ยืนยันการจ่าย</option><option value="cash">เงินสดที่ร้าน — ชำระตอนรับอาหาร</option></select></label></div><button class="confirm" id="orderSubmit" onclick="submitOrder()">ชำระเงิน · ฿${total}</button>`}
function updatePaymentButton(total){let pay=document.getElementById('paymentMethod').value,btn=document.getElementById('orderSubmit');btn.textContent=(pay==='cash'?'ยืนยันออเดอร์':'ชำระเงิน')+' · ฿'+total}
function submitOrder(){let items=active.menu.map((m,i)=>({name:m.name,price:m.price,qty:cart[i]||0})).filter(x=>x.qty);if(!items.length)return toast('กรุณาเลือกเมนูก่อน');let total=items.reduce((s,x)=>s+x.price*x.qty,0),queue=active.now+orders.filter(o=>o.shopId===active.id).length+1,pay=document.getElementById('paymentMethod').value,paymentMethod=pay==='promptpay'?'พร้อมเพย์ / QR':pay==='wallet'?'บัตร / วอลเล็ต':'เงินสดที่ร้าน',note=document.getElementById('orderNote').value.trim(),taste=document.getElementById('orderTaste').value,order={id:Date.now(),customer:name,shopId:active.id,items,queue,status:'รอร้านรับออเดอร์',total,note,taste,channel:orderChannel,paymentMethod,paymentStatus:pay==='cash'?'รอชำระที่ร้าน':'รอยืนยันการชำระ',createdAt:new Date().toISOString()};if(pay==='cash')return finalizeCustomerOrder(order);pendingOrder=order;showPaymentQr(order)}
function showPaymentQr(o){let shop=shops[o.shopId-1],ref='FQ'+String(o.id).slice(-8);showDialog(`<div class="dialog-title"><div><h2>ชำระเงิน</h2><p>${shop.icon} ${shop.name} · ตรวจสอบยอดก่อนยืนยัน</p></div><button class="closex" onclick="cancelPayment()" aria-label="ปิด">✕</button></div><div class="payment-box"><small>ยอดที่ต้องชำระ</small><div class="pay-amount">฿${o.total}</div><div class="payment-qr" aria-label="QR ชำระเงินจำลอง"></div><b>QR ชำระเงินจำลอง</b><p class="muted">ใช้สำหรับทดสอบ Prototype เท่านั้น</p><span class="pay-ref">เลขอ้างอิง ${ref}</span><div class="payment-help"><div><b>1</b>ตรวจสอบยอด</div><div><b>2</b>จำลองสแกน QR</div><div><b>3</b>กดยืนยันด้านล่าง</div></div></div><div class="modal-actions"><button class="cancelbtn" onclick="cancelPayment()">กลับไปแก้ไข</button><button class="okbtn" onclick="confirmPayment()">ยืนยันการชำระเงิน</button></div>`)}
function cancelPayment(){pendingOrder=null;closeDialog()}
function confirmPayment(){if(!pendingOrder)return;let order={...pendingOrder,paymentStatus:'ชำระแล้ว'};pendingOrder=null;finalizeCustomerOrder(order)}
function finalizeCustomerOrder(order){orders.push(order);storeId=order.shopId;localStorage.setItem('foodq_last_store',storeId);save();closeDialog();closeMenu();renderCustomer();toast((order.paymentStatus==='ชำระแล้ว'?'ชำระเงินและสั่งสำเร็จ':'สั่งสำเร็จ · รอชำระที่ร้าน')+' · คิว A'+order.queue)}
function selectStore(id){storeId=id;localStorage.setItem('foodq_last_store',id);renderMerchant()}
function merchantOrderCard(o,history=false){return `<article class="ordercard"><div class="q"><small>คิว</small><b>A${o.queue}</b></div><div class="info"><h3>${o.customer}</h3>${o.items.map(x=>`<p>${x.qty} × ${x.name}</p>`).join('')}<small><b>ระดับรสชาติ: ${o.taste}</b></small><small>${o.note?'หมายเหตุ: '+o.note:'ไม่มีหมายเหตุ'}</small><div class="payline"><span class="channelbadge">${o.channel}</span><span class="paybadge ${o.paymentStatus==='ชำระแล้ว'?'paid':'wait'}">${o.paymentMethod} · ${o.paymentStatus}</span></div><strong>รวม ฿${o.total}</strong></div><div class="state"><span>${o.status}</span>${history?'':nextButton(o)}${!history&&o.paymentStatus!=='ชำระแล้ว'?`<button class="paybtn" onclick="markPaid(${o.id})">ยืนยันรับเงิน</button>`:''}</div></article>`}
function renderMerchant(){let s=shops[storeId-1],all=orders.filter(o=>o.shopId===storeId),current=all.filter(isActiveOrder),history=all.filter(o=>!isActiveOrder(o));document.getElementById('merchant').innerHTML=`<div class="merchant"><aside class="side"><h3>เลือกร้านของคุณ</h3>${shops.map(x=>{let q=activeQueueCount(x.id),done=orders.filter(o=>o.shopId===x.id&&!isActiveOrder(o)).length;return`<button class="${storeId===x.id?'on':''}" onclick="selectStore(${x.id})"><span>${x.icon}</span><div><b>${x.name}</b><small>${q} คิวกำลังดำเนินการ${done?' · '+done+' ประวัติ':''}</small></div></button>`}).join('')}</aside><main class="main"><p class="muted">หน้าจัดการออเดอร์ · จำนวนคิวตรงกับหน้าลูกค้า</p><div class="merchant-tools"><div><h1>${s.icon} ${s.name}</h1><p class="muted"><b>${current.length} คิวกำลังดำเนินการ</b></p></div><button class="walkin" onclick="addWalkinOrder()">🎫 กดบัตรคิวหน้าร้าน</button></div><section>${current.length?current.map(o=>merchantOrderCard(o)).join(''):'<div class="empty"><h2>📭 ไม่มีคิวที่กำลังดำเนินการ</h2><p>ออเดอร์ที่รับอาหารแล้วจะย้ายไปอยู่ในประวัติ</p></div>'}</section>${history.length?`<details class="history-panel"><summary>ประวัติออเดอร์ (${history.length})</summary>${history.map(o=>merchantOrderCard(o,true)).join('')}</details>`:''}</main></div>`}
function addWalkinOrder(){let s=shops[storeId-1],queue=s.now+orders.filter(o=>o.shopId===s.id).length+1;showDialog(`<div class="dialog-title"><div><h2>🎫 กดบัตรคิวหน้าร้าน</h2><p>${s.icon} ${s.name} · กรอกข้อมูลสั้น ๆ แล้วออกคิวได้ทันที</p></div><button class="closex" onclick="closeDialog()" aria-label="ปิด">✕</button></div><div class="form-grid"><div class="fieldbox full"><label for="walkName">ชื่อลูกค้า</label><input id="walkName" value="ลูกค้าหน้าร้าน" placeholder="ชื่อหรือชื่อเล่น"></div><div class="fieldbox full"><label for="walkMenu">เมนูอาหาร</label><select id="walkMenu" onchange="updateWalkinPreview()">${s.menu.map((m,i)=>`<option value="${i}">${m.name} — ฿${m.price}</option>`).join('')}</select></div>${tasteSelect(s,'walkTaste','walk')}<div class="fieldbox"><label for="walkQty">จำนวน</label><input id="walkQty" type="number" min="1" max="10" value="1" oninput="updateWalkinPreview()"></div><div class="fieldbox"><label for="walkPay">การชำระเงิน</label><select id="walkPay"><option value="qr">สแกนจ่าย QR หน้าร้าน</option><option value="cash">เงินสด</option><option value="wait">ยังไม่ชำระ</option></select></div><div class="fieldbox full"><label for="walkNote">หมายเหตุเพิ่มเติม</label><textarea id="walkNote" placeholder="เช่น ไม่ใส่ผัก แยกน้ำ"></textarea></div></div><div class="queue-preview"><span>เลขคิวถัดไป <b>A${queue}</b></span><span>ยอดรวม <b id="walkTotal">฿${s.menu[0].price}</b></span></div><div class="modal-actions"><button class="cancelbtn" onclick="closeDialog()">ยกเลิก</button><button class="okbtn" onclick="confirmWalkinOrder()">ยืนยันและออกบัตรคิว</button></div>`)}
function updateWalkinPreview(){let s=shops[storeId-1],m=s.menu[Number(document.getElementById('walkMenu').value)],qty=Math.max(1,Number(document.getElementById('walkQty').value)||1);document.getElementById('walkTotal').textContent='฿'+m.price*qty}
function confirmWalkinOrder(){let s=shops[storeId-1],m=s.menu[Number(document.getElementById('walkMenu').value)],qty=Math.min(10,Math.max(1,Number(document.getElementById('walkQty').value)||1)),customer=document.getElementById('walkName').value.trim()||'ลูกค้าหน้าร้าน',note=document.getElementById('walkNote').value.trim(),taste=document.getElementById('walkTaste').value,pay=document.getElementById('walkPay').value,paymentMethod=pay==='qr'?'สแกนจ่าย QR หน้าร้าน':pay==='cash'?'เงินสด':'ยังไม่ชำระ',paymentStatus=pay==='wait'?'รอชำระที่ร้าน':'ชำระแล้ว',queue=s.now+orders.filter(o=>o.shopId===s.id).length+1,order={id:Date.now(),customer,shopId:s.id,items:[{name:m.name,price:m.price,qty}],queue,status:'รอร้านรับออเดอร์',total:m.price*qty,note,taste,channel:'หน้าร้าน',paymentMethod,paymentStatus,createdAt:new Date().toISOString()};orders.push(order);save();renderMerchant();showTicket(order,s)}
function showTicket(o,s){showDialog(`<div class="dialog-title"><div><h2>ออกบัตรคิวสำเร็จ</h2><p>แจ้งเลขนี้ให้ลูกค้าใช้ติดตามอาหาร</p></div><button class="closex" onclick="closeDialog()" aria-label="ปิด">✕</button></div><div class="ticket-card"><small>เลขคิวของคุณ</small><div class="ticket-number">A${o.queue}</div><b>${s.icon} ${s.name}</b><div class="ticket-details"><div><span>เมนู</span><b>${o.items[0].name} × ${o.items[0].qty}</b></div><div><span>ระดับรสชาติ</span><b>${o.taste}</b></div><div><span>ยอดรวม</span><b>฿${o.total}</b></div><div><span>การชำระ</span><b>${o.paymentStatus}</b></div></div></div><div class="modal-actions"><button class="okbtn" onclick="closeDialog()">เสร็จสิ้น</button></div>`)}
function nextButton(o){let map={'รอร้านรับออเดอร์':['รับออเดอร์แล้ว','รับออเดอร์'],'รับออเดอร์แล้ว':['กำลังทำ','เริ่มทำอาหาร'],'กำลังทำ':['พร้อมรับอาหาร','ทำเสร็จแล้ว'],'พร้อมรับอาหาร':['รับอาหารแล้ว','ปิดออเดอร์']},n=map[o.status];return n?`<button onclick="setStatus(${o.id},'${n[0]}')">${n[1]}</button>`:''}function setStatus(id,s){orders=orders.map(o=>o.id===id?{...o,status:s}:o);save();renderMerchant();toast('เปลี่ยนสถานะเป็น '+s)}function markPaid(id){orders=orders.map(o=>o.id===id?{...o,paymentStatus:'ชำระแล้ว'}:o);save();renderMerchant();toast('ยืนยันการชำระเงินแล้ว')}
</script></body></html>
